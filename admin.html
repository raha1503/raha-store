<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAHA Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050505;
  color:#fff;
}

header{
  background:#0b0b0b;
  border-bottom:1px solid #333;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  color:#d4af37;
  font-size:25px;
  font-weight:bold;
}

header span{
  color:#aaa;
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

h2{
  margin-top:0;
  color:#d4af37;
}

label{
  display:block;
  margin:14px 0 6px;
  color:#ccc;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border-radius:7px;
  border:1px solid #444;
  background:#181818;
  color:#fff;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d4af37;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

button{
  border:0;
  border-radius:7px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.gold{
  background:#d4af37;
  color:#000;
}

.dark{
  background:#222;
  color:#fff;
  border:1px solid #444;
}

.red{
  background:#9e2525;
  color:#fff;
}

button:hover{
  opacity:.85;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

#message{
  margin:15px 0;
  padding:12px;
  border-radius:7px;
  display:none;
}

.success{
  background:#123b20;
  color:#7cff9a;
}

.error{
  background:#401515;
  color:#ff8585;
}

.product{
  border:1px solid #292929;
  border-radius:10px;
  padding:15px;
  margin-top:12px;
  background:#0b0b0b;
}

.product h3{
  margin:0 0 8px;
  color:#d4af37;
}

.product p{
  margin:5px 0;
  color:#bbb;
}

.productButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.small{
  font-size:12px;
  color:#888;
}

#loginBox{
  max-width:450px;
  margin:80px auto;
}

.hidden{
  display:none;
}

.colorRow{
  display:grid;
  grid-template-columns:1fr 2fr auto;
  gap:10px;
  align-items:end;
  margin-bottom:12px;
  padding:12px;
  border:1px solid #292929;
  border-radius:8px;
  background:#0b0b0b;
}

.colorRow label{
  margin-top:0;
}

.removeColor{
  background:#9e2525;
  color:#fff;
  height:44px;
}

.colorTitle{
  color:#d4af37;
  font-weight:bold;
  margin-bottom:10px;
}

.preview{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:7px;
  border:1px solid #444;
  display:none;
  margin-top:6px;
}

  .grid{
    grid-template-columns:1fr;
  }

    align-items
