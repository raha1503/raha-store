<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAHA | Your Everyday Shopping Destination</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#111;
}

/* HEADER */

header{
  background:#000;
  color:#d4af37;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  letter-spacing:5px;
}

.cart{
  background:#d4af37;
  color:#000;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* HERO */

.hero{
  background:#000;
  color:white;
  text-align:center;
  padding:60px 20px;
}

.hero h1{
  font-size:42px;
  color:#d4af37;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
  margin-bottom:20px;
}

/* SEARCH */

.search{
  max-width:600px;
  margin:25px auto;
  display:flex;
}

.search input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:8px 0 0 8px;
  font-size:16px;
}

.search button{
  padding:15px 20px;
  border:0;
  background:#d4af37;
  cursor:pointer;
  border-radius:0 8px 8px 0;
}

/* CATEGORIES */

.categories{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
  display:flex;
