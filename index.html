<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAHA - Your Everyday Shopping Destination</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f7f7f7;
  color:#222;
}

/* HEADER */

header{
  background:#080808;
  color:#d4af37;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:28px;
  font-weight:bold;
  letter-spacing:3px;
}

.cart-btn{
  background:#d4af37;
  color:#000;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* HERO */

.hero{
  background:#111;
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  color:#d4af37;
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  font-size:18px;
  margin-bottom:25px;
}

.search-box{
  max-width:600px;
  margin:auto;
}

.search-box input{
  width:100%;
  padding:15px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:20px;
  background:white;
}

.categories button{
  white-space:nowrap;
  padding:10px 15px;
  border:1px solid #d4af37;
  background:white;
  border-radius:20px;
  cursor:pointer;
}

.categories button:hover{
  background:#d4af37;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px;
  padding:25px;
  max-width:1200px;
  margin:auto;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
  cursor:pointer;
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
}

.product img{
  width:100%;
  height:240px;
  object-fit:cover;
}

.product-info{
  padding:15px;
}

.product-info h3{
  margin-bottom:8px;
}

.price{
  color:#b08a00;
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.add-btn{
  width:100%;
  padding:11px;
  border:none;
  background:#111;
  color:#d4af37;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn:hover{
  background:#d4af37;
  color:#000;
}

/* PRODUCT DETAILS */

.details-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2500;
  padding:15px;
}

.details-overlay.active{
  display:flex;
}

.details-box{
  background:white;
  width:900px;
  max-width:100%;
  max-height:95vh;
  overflow-y:auto;
  border-radius:14px;
  padding:25px;
}

.details-close{
  float:right;
  background:#111;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.details-content{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  margin-top:15px;
}

.details-image{
  width:100%;
  height:450px;
  object-fit:cover;
  border-radius:10px;
  background:#f5f5f5;
}

.details-info h2{
  font-size:30px;
  margin-bottom:10px;
}

.details-description{
  line-height:1.6;
  margin:15px 0;
  color:#555;
}

.detail-label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

.details-info select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

.stock{
  color:green;
  font-weight:bold;
  margin-top:15px;
}

.details-add{
  width:100%;
  padding:14px;
  margin-top:20px;
  background:#d4af37;
  color:#000;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

/* CART */

.cart-panel{
  position:fixed;
  right:-450px;
  top:0;
  width:430px;
  max-width:95%;
  height:100%;
  background:white;
  z-index:2000;
  box-shadow:-5px 0 20px rgba(0,0,0,.3);
  padding:20px;
  transition:.3s;
  overflow-y:auto;
}

.cart-panel.active{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close-btn{
  background:#111;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:15px 0;
  display:flex;
  gap:12px;
}

.cart-item-image{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
  background:#f5f5f5;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-weight:bold;
  margin-bottom:5px;
}

.cart-item-option{
  font-size:14px;
  color:#666;
  margin-top:3px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:9px;
  flex-wrap:wrap;
}

.qty-btn{
  border:none;
  background:#111;
  color:white;
  width:28px;
  height:28px;
  border-radius:5px;
  cursor:pointer;
}

.remove-btn{
  border:none;
  background:#c00;
  color:white;
  padding:5px 8px;
  border-radius:5px;
  cursor:pointer;
}

.cart-total{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}

.checkout-btn{
  width:100%;
  padding:14px;
  background:#d4af37;
  color:#000;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* CHECKOUT */

.checkout-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
  padding:15px;
}

.checkout-overlay.active{
  display:flex;
}

.checkout-box{
  background:white;
  width:600px;
  max-width:100%;
  max-height:95vh;
  overflow-y:auto;
  border-radius:12px;
  padding:25px;
}

.checkout-box h2{
  margin-bottom:20px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.checkout-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.checkout-buttons button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.cancel-btn{
  background:#ddd;
}

.whatsapp-btn{
  background:#25D366;
  color:white;
}

/* FOOTER */

footer{
  background:#080808;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

footer span{
  color:#d4af37;
}

/* MOBILE */

@media(max-width:600px){

  .hero h1{
    font-size:34px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    padding:12px;
    gap:12px;
  }

  .product img{
    height:180px;
  }

  .product-info{
    padding:10px;
  }

  .product-info h3{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .cart-panel{
    width:100%;
    max-width:100%;
  }

  .details-content{
    grid-template-columns:1fr;
    gap:15px;
  }

  .details-image{
    height:300px;
  }

  .details-info h2{
    font-size:24px;
  }

  .checkout-buttons{
    flex-direction:column;
  }

}

</style>
</head>

<script>


/* =====================================
   PRODUCT DATABASE
===================================== */

const products = [

    description:
      "Elegant jewellery designed for everyday styling and special occasions.",

    sizes:[

    ],

    colors:[
      "Gold",
      "Silver"
    ],

    stock:20,

    images:{

      "Silver":
        "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=900&q=85"

    }

  },


  {
    id:2,

    name:"Classic T-Shirt",

    price:499,

    category:"Fashion",

    description:
      "Comfortable everyday T-shirt with a clean and modern style.",

    sizes:[
      "S",
      "M",
      "L",
      "XL",
      "XXL"
    ],

    colors:[
      "Black",
      "White",
      "Blue"
    ],

    stock:15,

    images:{

      "Black":
        "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=85",

      "White":
        "https://images.unsplash.com/photo-1583743814966-8936f37f4678?auto=format&fit=crop&w=900&q=85",

      "Blue":
        "https://images.unsplash.com/photo-1603252110481-7ba873bf42ab?auto=format&fit=crop&w=900&q=85"

    }

  },


  {
    id:3,

    name:"Premium Gift Box",

    price:399,

    category:"Gifts",

    description:
      "A stylish gift box suitable for birthdays, celebrations and special occasions.",

    sizes:[
      "Standard"
    ],

    colors:[
      "Red",
      "Gold"
    ],

    stock:10,

    images:{

      "Red":
        "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=900&q=85",

      "Gold":
        "https://5.imimg.com/data5/AB/WY/MY-14108330/gift-boxes.jpg"

    }

  },


  {
    id:4,

    name:"Stylish Handbag",

    price:799,

    category:"Accessories",

    description:
      "Stylish handbag designed for everyday use with a modern premium look.",

    sizes:[
      "Standard"
    ],

    colors:[
      "Black",
      "Brown"
    ],

    stock:12,

    images:{

      "Black":
        "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=900&q=85",

      "Brown":
        "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=900&q=85"

    }

  }

];


let cart = [];

let selectedProduct = null;


/* =====================================
   DEFAULT PRODUCT IMAGE
===================================== */

function getProductImage(product){

  return product.images[product.colors[0]];

}


/* =====================================
   DISPLAY PRODUCTS
===================================== */

function displayProducts(list){

  const container =
    document.getElementById("products");

  container.innerHTML = "";

  list.forEach(product => {

    container.innerHTML += `

      <div
        class="product"
        onclick="openDetails(${product.id})"
      >

        <img
          src="${getProductImage(product)}"
          alt="${product.name}"
        >

        <div class="product-info">

          <h3>
            ${product.name}
          </h3>

          <div class="price">
            ₹${product.price}
          </div>

          <button
            class="add-btn"
            onclick="event.stopPropagation(); addToCart(${product.id})"
          >
            Add to Cart 🛒
          </button>

        </div>

      </div>

    `;

  });

}


/* =====================================
   OPEN PRODUCT DETAILS
===================================== */

function openDetails(id){

  selectedProduct =
    products.find(
      product => product.id === id
    );

  if(!selectedProduct){
    return;
  }

  const sizeOptions =
    selectedProduct.sizes
      .map(size =>
        `<option value="${size}">
          ${size}
        </option>`
      )
      .join("");


  const colorOptions =
    selectedProduct.colors
      .map(color =>
        `<option value="${color}">
          ${color}
        </option>`
      )
      .join("");


  const firstColor =
    selectedProduct.colors[0];


  document.getElementById(
    "detailsContent"
  ).innerHTML = `

    <div class="details-content">

      <div>

        <img
          id="detailsImage"
          class="details-image"
          src="${selectedProduct.images[firstColor]}"
          alt="${selectedProduct.name}"
        >

      </div>


      <div class="details-info">

        <h2>
          ${selectedProduct.name}
        </h2>

        <div class="price">
          ₹${selectedProduct.price}
        </div>


        <p class="details-description">
          ${selectedProduct.description}
        </p>


        <label class="detail-label">
          Size
        </label>

        <select id="selectedSize">

          ${sizeOptions}

        </select>


        <label class="detail-label">
          Colour
        </label>

        <select
          id="selectedColor"
          onchange="changeProductColor()"
        >

          ${colorOptions}

        </select>


        <div class="stock">

          ✓ ${selectedProduct.stock}
          items available

        </div>


        <button
          class="details-add"
          onclick="addDetailedProductToCart()"
        >

          🛒 Add to Cart

        </button>

      </div>

    </div>

  `;


  document.getElementById(
    "detailsOverlay"
  ).classList.add("active");

}


/* =====================================
   CHANGE PRODUCT IMAGE BY COLOR
===================================== */

function changeProductColor(){

  if(!selectedProduct){
    return;
  }

  const color =
    document.getElementById(
      "selectedColor"
    ).value;


  const image =
    selectedProduct.images[color];


  if(image){

    document.getElementById(
      "detailsImage"
    ).src = image;

  }

}


/* =====================================
   CLOSE PRODUCT DETAILS
===================================== */

function closeDetails(){

  document.getElementById(
    "detailsOverlay"
  ).classList.remove("active");

  selectedProduct = null;

}


/* =====================================
   ADD DETAILED PRODUCT
===================================== */

function addDetailedProductToCart(){

  if(!selectedProduct){
    return;
  }


  const size =
    document.getElementById(
      "selectedSize"
    ).value;


  const color =
    document.getElementById(
      "selectedColor"
    ).value;


  const image =
    selectedProduct.images[color];


  const existing =
    cart.find(item =>
      item.id === selectedProduct.id &&
      item.size === size &&
      item.color === color
    );


  if(existing){

    existing.quantity++;

  }else{

    cart.push({

      id:selectedProduct.id,

      name:selectedProduct.name,

      price:selectedProduct.price,

      category:selectedProduct.category,

      size:size,

      color:color,

      image:image,

      quantity:1

    });

  }


  updateCartCount();

  closeDetails();

  alert("Added to Cart 🛒");

}


/* =====================================
   QUICK ADD TO CART
===================================== */

function addToCart(id){

  const product =
    products.find(
      item => item.id === id
    );


  if(!product){
    return;
  }


  const size =
    product.sizes[0];


  const color =
    product.colors[0];


  const image =
    product.images[color];


  const existing =
    cart.find(item =>
      item.id === id &&
      item.size === size &&
      item.color === color
    );


  if(existing){

    existing.quantity++;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:product.price,

      category:product.category,

      size:size,

      color:color,

      image:image,

      quantity:1

    });

  }


  updateCartCount();

  alert("Added to Cart 🛒");

}


/* =====================================
   CART COUNT
===================================== */

function updateCartCount(){

  const count =
    cart.reduce(
      (total,item) =>
        total + item.quantity,
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent = count;

}


/* =====================================
   OPEN CART
===================================== */

function openCart(){

  document.getElementById(
    "cartPanel"
  ).classList.add("active");


  renderCart();

}


/* =====================================
   CLOSE CART
===================================== */

function closeCart(){

  document.getElementById(
    "cartPanel"
  ).classList.remove("active");

}


/* =====================================
   RENDER CART
===================================== */

function renderCart(){

  const container =
    document.getElementById(
      "cartItems"
    );


  container.innerHTML = "";


  if(cart.length === 0){

    container.innerHTML =
      "<p>Your cart is empty.</p>";

    document.getElementById(
      "cartTotal"
    ).textContent = "0";

    return;

  }


  cart.forEach(
    (item,index) => {

      const subtotal =
        item.price *
        item.quantity;


      container.innerHTML += `

        <div class="cart-item">

          <img
            class="cart-item-image"
            src="${item.image}"
            alt="${item.name}"
          >


          <div class="cart-item-info">

            <div class="cart-item-name">
              ${item.name}
            </div>

            <div>
              ₹${item.price}
            </div>

            <div class="cart-item-option">
              Size: ${item.size}
            </div>

            <div class="cart-item-option">
              Colour: ${item.color}
            </div>

            <div class="cart-item-option">
              Subtotal: ₹${subtotal}
            </div>


            <div class="cart-controls">

              <button
                class="qty-btn"
                onclick="changeQuantity(${index},-1)"
              >
                −
              </button>

              <span>
                ${item.quantity}
              </span>

              <button
                class="qty-btn"
                onclick="changeQuantity(${index},1)"
              >
                +
              </button>

              <button
                class="remove-btn"
                onclick="removeFromCart(${index})"
              >
                Remove
              </button>

            </div>

          </div>

        </div>

      `;

    }
  );


  document.getElementById(
    "cartTotal"
  ).textContent =
    getCartTotal();

}


/* =====================================
   CHANGE QUANTITY
===================================== */

function changeQuantity(index,change){

  if(!cart[index]){
    return;
  }


  cart[index].quantity += change;


  if(cart[index].quantity <= 0){

    cart.splice(index,1);

  }


  updateCartCount();

  renderCart();

}


/* =====================================
   REMOVE ITEM
===================================== */

function removeFromCart(index){

  cart.splice(index,1);

  updateCartCount();

  renderCart();

}


/* =====================================
   CART TOTAL
===================================== */

function getCartTotal(){

  return cart.reduce(
    (total,item) =>
      total +
      item.price *
      item.quantity,
    0
  );

}


/* =====================================
   CHECKOUT
===================================== */

function openCheckout(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }


  document.getElementById(
    "checkoutOverlay"
  ).classList.add("active");

}


function closeCheckout(){

  document.getElementById(
    "checkoutOverlay"
  ).classList.remove("active");

}

/* =====================================
   LOAD DISTRICTS
===================================== */

function loadDistricts(){

  const state =
    document.getElementById(
      "customerState"
    ).value;


  const districtSelect =
    document.getElementById(
      "customerDistrict"
    );


  districtSelect.innerHTML =
    '<option value="">Select District</option>';


  if(!state){
    return;
  }


  const list =
    districts[state] || [];


  list.forEach(district => {

    const option =
      document.createElement("option");


    option.value =
      district;


    option.textContent =
      district;


    districtSelect.appendChild(
      option
    );

  });

}

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();

    document.getElementById(
      "customerPhone"
    ).value.trim();

    document.getElementById(
      "customerAddress"
    ).value.trim();


  const state =
    document.getElementById(
      "customerState"
    ).value;


  const district =
    document.getElementById(
      "customerDistrict"
    ).value;


  const pincode =
    document.getElementById(
      "customerPincode"
    ).value.trim();

    !name ||
    !phone ||
    !address ||
    !state ||
    !district ||
    !pincode

    alert(
      "Please fill all delivery details."
    );

  }


  if(
    !/^[0-9]{10}$/.test(phone)

    alert(

    );

  if(
    !/^[0-9]{6}$/.test(pincode)

      " | Colour: " +
      encodeURIComponent(item.color) +
      " = ₹" +
      subtotal +
      "%0A";

  });


  message +=
    "%0A*TOTAL: ₹" +
    getCartTotal() +
    "*%0A%0A";


  message +=
    "Payment: UPI after WhatsApp confirmation";


  const whatsappNumber =
    "918903188257";


  const url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    message;


  window.open(
    url,
    "_blank"
  );

}


/* =====================================
   SEARCH
===================================== */

function searchProducts(){

  const search =
    document.getElementById(
      "searchInput"
    ).value.toLowerCase();


  const filtered =
    products.filter(product =>
      product.name
        .toLowerCase()
        .includes(search)
    );


  displayProducts(filtered);

}


/* =====================================
   CATEGORY
===================================== */

function filterProducts(category){

  if(category === "All"){

    displayProducts(products);

    return;

  }


  const filtered =
    products.filter(
      product =>
        product.category === category
    );


  displayProducts(filtered);

}


/* =====================================
   START WEBSITE
===================================== */

displayProducts(products);

</script>
