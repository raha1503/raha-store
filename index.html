<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHA | Your Everyday Shopping Destination</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#050505;
  border-bottom:1px solid #d4af37;
}

.nav{
  max-width:1250px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  color:#d4af37;
  font-size:30px;
  font-weight:bold;
  letter-spacing:5px;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:12px 18px;
  border-radius:25px;
  border:1px solid #444;
  background:#151515;
  color:#fff;
  outline:none;
}

.cartBtn{
  border:0;
  background:#d4af37;
  color:#000;
  padding:12px 18px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  text-align:center;
  padding:65px 20px;
  background:linear-gradient(135deg,#070707,#1b1608);
}

.hero h1{
  color:#d4af37;
  font-size:52px;
  letter-spacing:6px;
}

.hero p{
  color:#ddd;
  margin-top:10px;
  font-size:18px;
}

.categories{
  max-width:1250px;
  margin:25px auto;
  padding:0 18px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.category{
  white-space:nowrap;
  padding:10px 18px;
  border:1px solid #d4af37;
  border-radius:25px;
  color:#d4af37;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#d4af37;
  color:#000;
}

.title{
  max-width:1250px;
  margin:35px auto 15px;
  padding:0 18px;
  color:#d4af37;
}

.products{
  max-width:1250px;
  margin:auto;
  padding:0 18px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px;
}

.product{
  background:#121212;
  border:1px solid #292929;
  border-radius:14px;
  overflow:hidden;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
  border-color:#d4af37;
}

.product img{
  width:100%;
  height:230px;
  object-fit:cover;
  cursor:pointer;
}

.info{
  padding:14px;
}

.info h3{
  font-size:16px;
  margin-bottom:7px;
}

.price{
  color:#d4af37;
  font-size:20px;
  font-weight:bold;
}

.stock{
  color:#aaa;
  font-size:13px;
  margin:7px 0;
}

.view{
  width:100%;
  padding:11px;
  background:#d4af37;
  color:#000;
  border:0;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.9);
  overflow:auto;
  padding:20px;
}

.modal{
  max-width:720px;
  margin:25px auto;
  background:#111;
  border:1px solid #d4af37;
  border-radius:15px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:16px;
  top:8px;
  font-size:30px;
  color:#d4af37;
  cursor:pointer;
  z-index:5;
}

.detailImg{
  width:100%;
  height:390px;
  object-fit:contain;
  background:#080808;
  border-radius:10px;
}

.modal h2{
  color:#d4af37;
  margin:15px 0 8px;
}

.modal p{
  color:#ccc;
}

.optionBox{
  margin-top:12px;
}

.optionBox label{
  display:block;
  margin-bottom:6px;
  color:#ddd;
}

select,
input,
textarea{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #444;
  background:#181818;
  color:#fff;
}

.fullBtn{
  width:100%;
  padding:13px;
  margin-top:15px;
  background:#d4af37;
  color:#000;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.cartItem{
  display:flex;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #333;
}

.cartItem img{
  width:78px;
  height:78px;
  object-fit:cover;
  border-radius:8px;
}

.cartInfo{
  flex:1;
}

.variant{
  color:#aaa;
  font-size:13px;
  margin-top:3px;
}

.qty{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
}

.qty button{
  width:28px;
  height:28px;
  border:0;
  background:#d4af37;
  color:#000;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
}

.remove{
  color:#ff7777;
  font-size:13px;
  margin-top:5px;
  cursor:pointer;
}

.total{
  text-align:right;
  color:#d4af37;
  font-size:23px;
  font-weight:bold;
  margin-top:20px;
}

footer{
  border-top:1px solid #333;
  text-align:center;
  padding:30px;
  color:#999;
}

@media(max-width:600px){

  .nav{
    flex-wrap:wrap;
  }

  .logo{
    font-size:25px;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero h1{
    font-size:38px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 10px 30px;
  }

  .product img{
    height:175px;
  }

  .info{
    padding:10px;
  }

  .info h3{
    font-size:14px;
  }

  .price{
    font-size:17px;
  }

  .detailImg{
    height:280px;
  }
}
</style>
</head>

<header>
<div class="nav">

<div class="logo">RAHA</div>

<div class="search">
<input id="searchInput"
       type="text"
       placeholder="Search products..."
       oninput="renderProducts()">
</div>

<button class="cartBtn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>
</header>


<section class="hero">
<h1>RAHA</h1>
<p>Your Everyday Shopping Destination</p>
</section>


<div class="categories" id="categories"></div>

<h2 class="title">Featured Products</h2>

<div class="products" id="products"></div>


<footer>
<p>© 2026 RAHA</p>
<p style="margin-top:8px">
Your Everyday Shopping Destination
</p>
<p style="margin-top:8px">
🇮🇳 Delivery Across India
</p>
</footer>


<!-- PRODUCT DETAILS -->

<div class="overlay" id="productOverlay">

<div class="modal">

<span class="close" onclick="closeProduct()">×</span>

<img id="detailImage"
     class="detailImg"
     src=""
     alt="Product">

<h2 id="detailName"></h2>

<p id="detailDescription"></p>

<p class="price" id="detailPrice"></p>

<p class="stock" id="detailStock"></p>


<div class="optionBox" id="sizeBox">

<label>Size</label>

<select id="sizeSelect"></select>

</div>


<div class="optionBox" id="colorBox">

<label>Colour</label>

<select id="colorSelect"
        onchange="changeColourImage()">
</select>

</div>


<button class="fullBtn"
        onclick="addToCart()">
🛒 Add to Cart
</button>

</div>
</div>


<!-- CART -->

<div class="overlay" id="cartOverlay">

<div class="modal">

<span class="close" onclick="closeCart()">×</span>

<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<div class="total">
Total: ₹<span id="cartTotal">0</span>
</div>

<button class="fullBtn"
        onclick="openCheckout()">
Proceed to Checkout
</button>

</div>
</div>


<!-- CHECKOUT -->

<div class="overlay" id="checkoutOverlay">

<div class="modal">

<span class="close" onclick="closeCheckout()">×</span>

<h2>Checkout</h2>

<label>Full Name *</label>
<input id="customerName"
       placeholder="Enter your full name">

<br><br>

<label>Mobile Number *</label>
<input id="customerPhone"
       maxlength="10"
       placeholder="10 digit mobile number">

<br><br>

<label>Full Address *</label>
<textarea id="customerAddress"
          rows="4"
          placeholder="House number, street, area, city"></textarea>

<br>

<label>Pincode *</label>
<input id="customerPincode"
       maxlength="6"
       placeholder="6 digit pincode">

<br><br>

<label>State *</label>
<select id="customerState"
        onchange="loadDistricts()">
</select>

<br><br>

<label>District *</label>
<select id="customerDistrict">
<option value="">Select District</option>
</select>

<button class="fullBtn"
        onclick="sendWhatsAppOrder()">
📱 Order on WhatsApp
</button>

<p style="font-size:13px;margin-top:12px;color:#999">
UPI payment will be provided through WhatsApp after
RAHA confirms your order.
</p>

</div>
</div>
