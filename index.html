<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHA | Your Everyday Shopping Destination</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#050505;
  border-bottom:1px solid #d4af37;
}

.nav{
  max-width:1250px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  color:#d4af37;
  font-size:30px;
  font-weight:bold;
  letter-spacing:5px;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:12px 18px;
  border-radius:25px;
  border:1px solid #444;
  background:#151515;
  color:#fff;
  outline:none;
}

.cartBtn{
  border:0;
  background:#d4af37;
  color:#000;
  padding:12px 18px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  text-align:center;
  padding:65px 20px;
  background:linear-gradient(135deg,#070707,#1b1608);
}

.hero h1{
  color:#d4af37;
  font-size:52px;
  letter-spacing:6px;
}

.hero p{
  color:#ddd;
  margin-top:10px;
  font-size:18px;
}

.categories{
  max-width:1250px;
  margin:25px auto;
  padding:0 18px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.category{
  white-space:nowrap;
  padding:10px 18px;
  border:1px solid #d4af37;
  border-radius:25px;
  color:#d4af37;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#d4af37;
  color:#000;
}

.title{
  max-width:1250px;
  margin:35px auto 15px;
  padding:0 18px;
  color:#d4af37;
}

.products{
  max-width:1250px;
  margin:auto;
  padding:0 18px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px;
}

.product{
  background:#121212;
  border:1px solid #292929;
  border-radius:14px;
  overflow:hidden;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
  border-color:#d4af37;
}

.product img{
  width:100%;
  height:230px;
  object-fit:cover;
  cursor:pointer;
}

.info{
  padding:14px;
}

.info h3{
  font-size:16px;
  margin-bottom:7px;
}

.price{
  color:#d4af37;
  font-size:20px;
  font-weight:bold;
}

.stock{
  color:#aaa;
  font-size:13px;
  margin:7px 0;
}

.view{
  width:100%;
  padding:11px;
  background:#d4af37;
  color:#000;
  border:0;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.9);
  overflow:auto;
  padding:20px;
}

.modal{
  max-width:720px;
  margin:25px auto;
  background:#111;
  border:1px solid #d4af37;
  border-radius:15px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:16px;
  top:8px;
  font-size:30px;
  color:#d4af37;
  cursor:pointer;
  z-index:5;
}

.detailImg{
  width:100%;
  height:390px;
  object-fit:contain;
  background:#080808;
  border-radius:10px;
}

.modal h2{
  color:#d4af37;
  margin:15px 0 8px;
}

.modal p{
  color:#ccc;
}

.optionBox{
  margin-top:12px;
}

.optionBox label{
  display:block;
  margin-bottom:6px;
  color:#ddd;
}

select,
input,
textarea{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #444;
  background:#181818;
  color:#fff;
}

.fullBtn{
  width:100%;
  padding:13px;
  margin-top:15px;
  background:#d4af37;
  color:#000;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.cartItem{
  display:flex;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #333;
}

.cartItem img{
  width:78px;
  height:78px;
  object-fit:cover;
  border-radius:8px;
}

.cartInfo{
  flex:1;
}

.variant{
  color:#aaa;
  font-size:13px;
  margin-top:3px;
}

.qty{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
}

.qty button{
  width:28px;
  height:28px;
  border:0;
  background:#d4af37;
  color:#000;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
}

.remove{
  color:#ff7777;
  font-size:13px;
  margin-top:5px;
  cursor:pointer;
}

.total{
  text-align:right;
  color:#d4af37;
  font-size:23px;
  font-weight:bold;
  margin-top:20px;
}

footer{
  border-top:1px solid #333;
  text-align:center;
  padding:30px;
  color:#999;
}

@media(max-width:600px){

  .nav{
    flex-wrap:wrap;
  }

  .logo{
    font-size:25px;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero h1{
    font-size:38px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 10px 30px;
  }

  .product img{
    height:175px;
  }

  .info{
    padding:10px;
  }

  .info h3{
    font-size:14px;
  }

  .price{
    font-size:17px;
  }

  .detailImg{
    height:280px;
  }
}
</style>
</head>

<header>
<div class="nav">

<div class="logo">RAHA</div>

<div class="search">
<input id="searchInput"
       type="text"
       placeholder="Search products..."
       oninput="renderProducts()">
</div>

<button class="cartBtn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>
</header>


<section class="hero">
<h1>RAHA</h1>
<p>Your Everyday Shopping Destination</p>
</section>


<div class="categories" id="categories"></div>

<h2 class="title">Featured Products</h2>

<div class="products" id="products"></div>


<footer>
<p>© 2026 RAHA</p>
<p style="margin-top:8px">
Your Everyday Shopping Destination
</p>
<p style="margin-top:8px">
🇮🇳 Delivery Across India
</p>
</footer>


<!-- PRODUCT DETAILS -->

<div class="overlay" id="productOverlay">

<div class="modal">

<span class="close" onclick="closeProduct()">×</span>

<img id="detailImage"
     class="detailImg"
     src=""
     alt="Product">

<h2 id="detailName"></h2>

<p id="detailDescription"></p>

<p class="price" id="detailPrice"></p>

<p class="stock" id="detailStock"></p>


<div class="optionBox" id="sizeBox">

<label>Size</label>

<select id="sizeSelect"></select>

</div>


<div class="optionBox" id="colorBox">

<label>Colour</label>

<select id="colorSelect"
        onchange="changeColourImage()">
</select>

</div>


<button class="fullBtn"
        onclick="addToCart()">
🛒 Add to Cart
</button>

</div>
</div>


<!-- CART -->

<div class="overlay" id="cartOverlay">

<div class="modal">

<span class="close" onclick="closeCart()">×</span>

<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<div class="total">
Total: ₹<span id="cartTotal">0</span>
</div>

<button class="fullBtn"
        onclick="openCheckout()">
Proceed to Checkout
</button>

</div>
</div>


<!-- CHECKOUT -->

<div class="overlay" id="checkoutOverlay">

<div class="modal">

<span class="close" onclick="closeCheckout()">×</span>

<h2>Checkout</h2>

<label>Full Name *</label>
<input id="customerName"
       placeholder="Enter your full name">

<br><br>

<label>Mobile Number *</label>
<input id="customerPhone"
       maxlength="10"
       placeholder="10 digit mobile number">

<br><br>

<label>Full Address *</label>
<textarea id="customerAddress"
          rows="4"
          placeholder="House number, street, area, city"></textarea>

<br>

<label>Pincode *</label>
<input id="customerPincode"
       maxlength="6"
       placeholder="6 digit pincode">

<br><br>

<label>State *</label>
<select id="customerState"
        onchange="loadDistricts()">
</select>

<br><br>

<label>District *</label>
<select id="customerDistrict">
<option value="">Select District</option>
</select>

<button class="fullBtn"
        onclick="sendWhatsAppOrder()">
📱 Order on WhatsApp
</button>

<p style="font-size:13px;margin-top:12px;color:#999">
UPI payment will be provided through WhatsApp after
RAHA confirms your order.
</p>

</div>
</div>

let cart=[];
let currentProduct=null;
let selectedCategory="All";


/* =========================
   CATEGORIES
========================= */

function renderCategories(){

const categories=[
"All",
...new Set(products.map(p=>p.category))
];

document.getElementById("categories").innerHTML=
categories.map(category=>`

<div class="category ${category==="All"?"active":""}"
onclick="selectCategory('${category}')">

${category}

</div>

`).join("");

}


function selectCategory(category){

selectedCategory=category;

document.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll(".category")
.forEach(x=>{
if(x.textContent.trim()===category)
x.classList.add("active");
});

renderProducts();

}


/* =========================
   PRODUCTS
========================= */

function renderProducts(){

const search=
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();

const list=products.filter(product=>

(selectedCategory==="All"||
 product.category===selectedCategory)

&&

(product.name.toLowerCase().includes(search)||
 product.category.toLowerCase().includes(search))

);

const container=
document.getElementById("products");

container.innerHTML=list.map(product=>{

const firstImage=
Object.values(product.colours)[0];

return`

<div class="product">

<img src="${firstImage}"
onclick="openProduct(${product.id})"
onerror="this.src='https://via.placeholder.com/600x600?text=RAHA'">

<div class="info">

<h3>${product.name}</h3>

<div class="price">
₹${product.price.toLocaleString("en-IN")}
</div>

<div class="stock">
${product.stock>0
?"In Stock: "+product.stock
:"Out of Stock"}
</div>

<button class="view"
onclick="openProduct(${product.id})">

View Product

</button>

</div>
</div>

`;

}).join("");

if(list.length===0){

container.innerHTML=
`<p style="grid-column:1/-1;text-align:center;color:#aaa">
No products found.
</p>`;

}

}


/* =========================
   OPEN PRODUCT
========================= */

function openProduct(id){

currentProduct=
products.find(p=>p.id===id);

if(!currentProduct)return;

document.getElementById("detailName")
.textContent=currentProduct.name;

document.getElementById("detailDescription")
.textContent=currentProduct.description;

document.getElementById("detailPrice")
.textContent=
"₹"+currentProduct.price.toLocaleString("en-IN");

document.getElementById("detailStock")
.textContent=
"Stock available: "+currentProduct.stock;


/* SIZE */

const sizeBox=
document.getElementById("sizeBox");

const sizeSelect=
document.getElementById("sizeSelect");

if(currentProduct.sizes.length){

sizeBox.style.display="block";

sizeSelect.innerHTML=
currentProduct.sizes
.map(size=>`<option value="${size}">${size}</option>`)
.join("");

}else{

sizeBox.style.display="none";

sizeSelect.innerHTML=
`<option value="">Not applicable</option>`;

}


/* COLOUR */

const colors=
Object.keys(currentProduct.colours);

const colorBox=
document.getElementById("colorBox");

const colorSelect=
document.getElementById("colorSelect");

if(colors.length){

colorBox.style.display="block";

colorSelect.innerHTML=
colors
.map(color=>`
<option value="${color}">
${color}
</option>
`)
.join("");

}else{

colorBox.style.display="none";

}

changeColourImage();

document.getElementById("productOverlay")
.style.display="block";

}


/* =========================
   COLOUR → IMAGE
========================= */

function changeColourImage(){

if(!currentProduct)return;

const selectedColour=
document.getElementById("colorSelect").value;

const image=
currentProduct.colours[selectedColour];

if(image){

document.getElementById("detailImage").src=image;

}

}


/* =========================
   ADD TO CART
========================= */

function addToCart(){

if(!currentProduct)return;

if(currentProduct.stock<=0){

alert("This product is out of stock.");

return;

}

const size=
currentProduct.sizes.length
?document.getElementById("sizeSelect").value
:"";

const colour=
Object.keys(currentProduct.colours).length
?document.getElementById("colorSelect").value
:"";


const existing=
cart.find(item=>

item.id===currentProduct.id&&
item.size===size&&
item.colour===colour

);


if(existing){

if(existing.quantity>=currentProduct.stock){

alert("Maximum available stock reached.");

return;

}

existing.quantity++;

}else{

cart.push({

id:currentProduct.id,

name:currentProduct.name,

price:currentProduct.price,

image:currentProduct.colours[colour],

size:size,

colour:colour,

quantity:1,

stock:currentProduct.stock

});

}

updateCart();

closeProduct();

alert("Added to cart 🛒");

}


/* =========================
   CART
========================= */

function updateCart(){

document.getElementById("cartCount")
.textContent=
cart.reduce((sum,item)=>sum+item.quantity,0);

renderCart();

}


function renderCart(){

const container=
document.getElementById("cartItems");

let total=0;

if(cart.length===0){

container.innerHTML=
`<p style="text-align:center;color:#aaa;padding:20px">
Your cart is empty.
</p>`;

document.getElementById("cartTotal")
.textContent="0";

return;

}


container.innerHTML=
cart.map((item,index)=>{

const subtotal=
item.price*item.quantity;

total+=subtotal;

return`

<div class="cartItem">

<img src="${item.image}"
onerror="this.src='https://via.placeholder.com/100?text=RAHA'">

<div class="cartInfo">

<strong>${item.name}</strong>

<div class="price">
₹${item.price.toLocaleString("en-IN")}
</div>

${item.size?
`<div class="variant">
Size: ${item.size}
</div>`:""}

${item.colour?
`<div class="variant">
Colour: ${item.colour}
</div>`:""}

<div class="qty">

<button onclick="changeQuantity(${index},-1)">
−
</button>

<span>${item.quantity}</span>

<button onclick="changeQuantity(${index},1)">
+
</button>

</div>

<div style="font-size:13px;margin-top:5px">
Subtotal: ₹${subtotal.toLocaleString("en-IN")}
</div>

<div class="remove"
onclick="removeItem(${index})">
Remove
</div>

</div>
</div>

`;

}).join("");


document.getElementById("cartTotal")
.textContent=
total.toLocaleString("en-IN");

}


function changeQuantity(index,change){

const item=cart[index];

item.quantity+=change;

if(item.quantity<=0){

cart.splice(index,1);

}

else if(item.quantity>item.stock){

item.quantity=item.stock;

alert("Maximum available stock reached.");

}

updateCart();

}


function removeItem(index){

cart.splice(index,1);

updateCart();

}


function openCart(){

renderCart();

document.getElementById("cartOverlay")
.style.display="block";

}


function closeCart(){

document.getElementById("cartOverlay")
.style.display="none";

}

/* =========================
   WHATSAPP ORDER
========================= */

function sendWhatsAppOrder(){

const name=
document.getElementById("customerName")
.value.trim();

const phone=
document.getElementById("customerPhone")
.value.trim();

const address=
document.getElementById("customerAddress")
.value.trim();

const pincode=
document.getElementById("customerPincode")
.value.trim();

const state=
document.getElementById("customerState")
.value;

const district=
document.getElementById("customerDistrict")
.value;


if(!name||
!phone||
!address||
!pincode||
!state||
!district){

alert("Please fill all required details.");

return;

}


if(!/^[0-9]{10}$/.test(phone)){

alert("Enter a valid 10 digit mobile number.");

return;

}


if(!/^[0-9]{6}$/.test(pincode)){

alert("Enter a valid 6 digit pincode.");

return;

}


if(cart.length===0){

alert("Your cart is empty.");

return;

}


let total=0;

let message=
"🛍️ *RAHA NEW ORDER*%0A%0A";


cart.forEach((item,index)=>{

const subtotal=
item.price*item.quantity;

total+=subtotal;


message+=
`${index+1}. *${encodeURIComponent(item.name)}*%0A`;

message+=
`Qty: ${item.quantity}%0A`;

if(item.size){

message+=
`Size: ${encodeURIComponent(item.size)}%0A`;

}

if(item.colour){

message+=
`Colour: ${encodeURIComponent(item.colour)}%0A`;

}

message+=
`Price: ₹${item.price}%0A`;

message+=
`Subtotal: ₹${subtotal}%0A%0A`;

});


message+=
`*TOTAL: ₹${total.toLocaleString("en-IN")}*%0A%0A`;

message+=
"👤 *CUSTOMER DETAILS*%0A";

message+=
`Name: ${encodeURIComponent(name)}%0A`;

message+=
`Mobile: ${encodeURIComponent(phone)}%0A`;

message+=
`Address: ${encodeURIComponent(address)}%0A`;

message+=
`Pincode: ${encodeURIComponent(pincode)}%0A`;

message+=
`State: ${encodeURIComponent(state)}%0A`;

message+=
`District: ${encodeURIComponent(district)}%0A%0A`;

message+=
"💳 Payment: UPI after confirmation%0A";

message+=
"📦 Delivery: All India";


window.open(
"https://wa.me/918903188257?text="+message,
"_blank"
);

}
