<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHA | Your Everyday Shopping Destination</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#111;
}

header{
  background:#000;
  color:#d4af37;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  letter-spacing:5px;
}

.cart{
  background:#d4af37;
  color:#000;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:#000;
  color:white;
  text-align:center;
  padding:60px 20px;
}

.hero h1{
  font-size:42px;
  color:#d4af37;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
  margin-bottom:20px;
}

.search{
  max-width:600px;
  margin:25px auto;
  display:flex;
}

.search input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:8px 0 0 8px;
  font-size:16px;
}

.search button{
  padding:15px 20px;
  border:0;
  background:#d4af37;
  cursor:pointer;
  border-radius:0 8px 8px 0;
}

.categories{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.categories button{
  white-space:nowrap;
  padding:10px 18px;
  border:1px solid #ddd;
  background:white;
  border-radius:20px;
  cursor:pointer;
}

.products{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:15px;
}

.product h3{
  margin-bottom:8px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.add{
  width:100%;
  padding:11px;
  background:#000;
  color:#d4af37;
  border:0;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

footer{
  background:#000;
  color:white;
  text-align:center;
  padding:30px;
  margin-top:50px;
}

@media(max-width:600px){
  .hero h1{
    font-size:32px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product img{
    height:180px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">RAHA</div>
    <button class="cart" onclick="showCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<section class="hero">
  <h1>RAHA</h1>
  <p>Your Everyday Shopping Destination</p>

  <div class="search">
    <input
      type="text"
      id="searchBox"
      placeholder="Search products..."
      oninput="searchProducts()"
    >
    <button>🔎</button>
  </div>
</section>

<div class="categories">
  <button onclick="filterProducts('All')">All</button>
  <button onclick="filterProducts('Jewellery')">💎 Jewellery</button>
  <button onclick="filterProducts('Fashion')">👕 Fashion</button>
  <button onclick="filterProducts('Gifts')">🎁 Gifts</button>
  <button onclick="filterProducts('Accessories')">👜 Accessories</button>
  <button onclick="filterProducts('Home')">🏠 Home</button>
</div>

<section class="products" id="products"></section>

<footer>
  <h2>RAHA</h2>
  <p>Shop with us ❤️</p>
  <p>All India Delivery</p>
</footer>

<script>

let products = [
  {
    id:1,
    name:"Sample Jewellery",
    price:299,
    category:"Jewellery",
    image:"https://via.placeholder.com/500x500?text=RAHA+Jewellery"
  },
  {
    id:2,
    name:"Sample T-Shirt",
    price:499,
    category:"Fashion",
    image:"https://via.placeholder.com/500x500?text=RAHA+Fashion"
  },
  {
    id:3,
    name:"Sample Gift",
    price:399,
    category:"Gifts",
    image:"https://via.placeholder.com/500x500?text=RAHA+Gift"
  },
  {
    id:4,
    name:"Sample Accessories",
    price:199,
    category:"Accessories",
    image:"https://via.placeholder.com/500x500?text=RAHA+Accessories"
  }
];

let cart = [];

function displayProducts(list=products){

  const container=document.getElementById("products");

  container.innerHTML="";

  list.forEach(product=>{

    container.innerHTML += `
      <div class="product">

        <img src="${product.image}" alt="${product.name}">

        <div class="product-info">

          <h3>${product.name}</h3>

          <div class="price">₹${product.price}</div>

          <button class="add"
            onclick="addToCart(${product.id})">
            Add to Cart
          </button>

        </div>

      </div>
    `;

  });
}

function addToCart(id){

  const product=products.find(p=>p.id===id);

  const existing=cart.find(p=>p.id===id);

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      ...product,
      quantity:1
    });
  }

  updateCart();

  alert("Product added to cart 🛒");
}

function updateCart(){

  let total=0;

  cart.forEach(item=>{
    total += item.price * item.quantity;
  });

  document.getElementById("cartCount").textContent =
    cart.reduce((sum,item)=>sum+item.quantity,0);

}

function showCart(){

  if(cart.length===0){
    alert("Your cart is empty.");
    return;
  }

  let message="Your RAHA Cart%0A%0A";
  let total=0;

  cart.forEach(item=>{

    const subtotal=item.price*item.quantity;

    message +=
      `${item.name} x ${item.quantity} = ₹${subtotal}%0A`;

    total += subtotal;

  });

  message += `%0ATotal: ₹${total}`;

  alert(
    "Cart Total: ₹"+total+
    "\n\nNext we will add the full checkout + WhatsApp order system."
  );

}

function searchProducts(){

  const text=document
    .getElementById("searchBox")
    .value
    .toLowerCase();

  const filtered=products.filter(product =>
    product.name.toLowerCase().includes(text) ||
    product.category.toLowerCase().includes(text)
  );

  displayProducts(filtered);
}

function filterProducts(category){

  if(category==="All"){
    displayProducts(products);
    return;
  }

  displayProducts(
    products.filter(product =>
      product.category===category
    )
  );
}

displayProducts();

</script>

</body>
</html>
