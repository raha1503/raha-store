<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHA - Your Everyday Shopping Destination</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#f7f7f7;
  color:#222;
}

header{
  background:#080808;
  color:#d4af37;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:28px;
  font-weight:bold;
  letter-spacing:3px;
}

.cart-btn{
  background:#d4af37;
  color:#000;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:#111;
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  color:#d4af37;
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  font-size:18px;
  margin-bottom:25px;
}

.search-box{
  max-width:600px;
  margin:auto;
}

.search-box input{
  width:100%;
  padding:15px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:20px;
  background:white;
}

.categories button{
  white-space:nowrap;
  padding:10px 15px;
  border:1px solid #d4af37;
  background:white;
  border-radius:20px;
  cursor:pointer;
}

.categories button:hover{
  background:#d4af37;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px;
  padding:25px;
  max-width:1200px;
  margin:auto;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.product-info{
  padding:15px;
}

.product-info h3{
  margin-bottom:8px;
}

.price{
  color:#b08a00;
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.add-btn{
  width:100%;
  padding:11px;
  border:none;
  background:#111;
  color:#d4af37;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn:hover{
  background:#d4af37;
  color:#000;
}

/* CART */
.cart-panel{
  position:fixed;
  right:-420px;
  top:0;
  width:400px;
  max-width:95%;
  height:100%;
  background:white;
  z-index:2000;
  box-shadow:-5px 0 20px rgba(0,0,0,.3);
  padding:20px;
  transition:.3s;
  overflow-y:auto;
}

.cart-panel.active{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close-btn{
  background:#111;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.cart-item-name{
  font-weight:bold;
  margin-bottom:5px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.qty-btn{
  border:none;
  background:#111;
  color:white;
  width:28px;
  height:28px;
  border-radius:5px;
  cursor:pointer;
}

.remove-btn{
  border:none;
  background:#c00;
  color:white;
  padding:5px 8px;
  border-radius:5px;
  cursor:pointer;
}

.cart-total{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}

.checkout-btn{
  width:100%;
  padding:14px;
  background:#d4af37;
  color:#000;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* CHECKOUT */
.checkout-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
  padding:15px;
}

.checkout-overlay.active{
  display:flex;
}

.checkout-box{
  background:white;
  width:600px;
  max-width:100%;
  max-height:95vh;
  overflow-y:auto;
  border-radius:12px;
  padding:25px;
}

.checkout-box h2{
  margin-bottom:20px;
  color:#111;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.checkout-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.checkout-buttons button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.cancel-btn{
  background:#ddd;
}

.whatsapp-btn{
  background:#25D366;
  color:white;
}

/* FOOTER */
footer{
  background:#080808;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

footer span{
  color:#d4af37;
}

/* MOBILE */
@media(max-width:600px){
  .hero h1{
    font-size:34px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    padding:12px;
    gap:12px;
  }

  .product img{
    height:160px;
  }

  .product-info{
    padding:10px;
  }

  .product-info h3{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .cart-panel{
    width:100%;
    max-width:100%;
  }

  .checkout-buttons{
    flex-direction:column;
  }
}
</style>
</head>

/* =========================
   PRODUCTS
========================= */

const products = [

  {
    id:1,
    name:"Sample Jewellery",
    price:299,
    category:"Jewellery",
    image:"https://via.placeholder.com/500x500?text=RAHA+Jewellery"
  },

  {
    id:2,
    name:"Sample T-Shirt",
    price:499,
    category:"Fashion",
    image:"https://via.placeholder.com/500x500?text=RAHA+Fashion"
  },

  {
    id:3,
    name:"Sample Gift",
    price:399,
    category:"Gifts",
    image:"https://via.placeholder.com/500x500?text=RAHA+Gift"
  },

  {
    id:4,
    name:"Sample Accessories",
    price:199,
    category:"Accessories",
    image:"https://via.placeholder.com/500x500?text=RAHA+Accessories"
  }

];

let cart = [];


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(list){

  const container = document.getElementById("products");

  container.innerHTML = "";

  list.forEach(product => {

    container.innerHTML += `

      <div class="product">

        <img
          src="${product.image}"
          alt="${product.name}"
        >

        <div class="product-info">

          <h3>${product.name}</h3>

          <div class="price">
            ₹${product.price}
          </div>

          <button
            class="add-btn"
            onclick="addToCart(${product.id})"
          >
            Add to Cart 🛒
          </button>

        </div>

      </div>

    `;

  });

}


/* =========================
   ADD TO CART
========================= */

function addToCart(id){

  const existing = cart.find(item => item.id === id);

  if(existing){

    existing.quantity++;

  }else{

    const product = products.find(item => item.id === id);

    cart.push({
      ...product,
      quantity:1
    });

  }

  updateCartCount();

  alert("Added to Cart 🛒");

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const count = cart.reduce(
    (total,item) => total + item.quantity,
    0
  );

  document.getElementById("cartCount").textContent = count;

}


/* =========================
   OPEN CART
========================= */

function openCart(){

  document.getElementById("cartPanel")
    .classList.add("active");

  renderCart();

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

  document.getElementById("cartPanel")
    .classList.remove("active");

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const container =
    document.getElementById("cartItems");

  container.innerHTML = "";

  if(cart.length === 0){

    container.innerHTML =
      "<p>Your cart is empty.</p>";

    document.getElementById("cartTotal")
      .textContent = "0";

    return;

  }

  cart.forEach(item => {

    const subtotal =
      item.price * item.quantity;

    container.innerHTML += `

      <div class="cart-item">

        <div class="cart-item-name">
          ${item.name}
        </div>

        <div>
          ₹${item.price} × ${item.quantity}
          = ₹${subtotal}
        </div>

        <div class="cart-controls">

          <button
            class="qty-btn"
            onclick="changeQuantity(${item.id},-1)"
          >
            −
          </button>

          <span>${item.quantity}</span>

          <button
            class="qty-btn"
            onclick="changeQuantity(${item.id},1)"
          >
            +
          </button>

          <button
            class="remove-btn"
            onclick="removeFromCart(${item.id})"
          >
            Remove
          </button>

        </div>

      </div>

    `;

  });

  document.getElementById("cartTotal")
    .textContent = getCartTotal();

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(id,change){

  const item = cart.find(item => item.id === id);

  if(!item) return;

  item.quantity += change;

  if(item.quantity <= 0){

    cart = cart.filter(item => item.id !== id);

  }

  updateCartCount();

  renderCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeFromCart(id){

  cart = cart.filter(item => item.id !== id);

  updateCartCount();

  renderCart();

}


/* =========================
   CART TOTAL
========================= */

function getCartTotal(){

  return cart.reduce(
    (total,item) =>
      total + (item.price * item.quantity),
    0
  );

}


/* =========================
   CHECKOUT
========================= */

function openCheckout(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }

  document.getElementById("checkoutOverlay")
    .classList.add("active");

}


function closeCheckout(){

  document.getElementById("checkoutOverlay")
    .classList.remove("active");

}

/* =========================
   LOAD DISTRICTS
========================= */

function loadDistricts(){

  const state =
    document.getElementById("customerState").value;

  const districtSelect =
    document.getElementById("customerDistrict");

  districtSelect.innerHTML =
    '<option value="">Select District</option>';

  if(!state) return;

  const stateDistricts =
    districts[state] || [];

  stateDistricts.forEach(district => {

    const option =
      document.createElement("option");

    option.value = district;
    option.textContent = district;

    districtSelect.appendChild(option);

  });

}


/* =========================
   WHATSAPP ORDER
========================= */

function orderOnWhatsApp(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const state =
    document.getElementById("customerState").value;

  const district =
    document.getElementById("customerDistrict").value;

  const pincode =
    document.getElementById("customerPincode").value.trim();


  if(!name ||
     !phone ||
     !address ||
     !state ||
     !district ||
     !pincode){

    alert("Please fill all delivery details.");

    return;

  }


  if(!/^[0-9]{10}$/.test(phone)){

    alert("Please enter a valid 10-digit mobile number.");

    return;

  }


  if(!/^[0-9]{6}$/.test(pincode)){

    alert("Please enter a valid 6-digit pincode.");

    return;

  }


  let message =
    "🛍️ *RAHA NEW ORDER*%0A%0A";


  message +=
    "*CUSTOMER DETAILS*%0A";

  message +=
    "Name: " + encodeURIComponent(name) + "%0A";

  message +=
    "Mobile: " + encodeURIComponent(phone) + "%0A";

  message +=
    "Address: " + encodeURIComponent(address) + "%0A";

  message +=
    "District: " + encodeURIComponent(district) + "%0A";

  message +=
    "State: " + encodeURIComponent(state) + "%0A";

  message +=
    "Pincode: " + encodeURIComponent(pincode) + "%0A%0A";


  message +=
    "*ORDER ITEMS*%0A";


  cart.forEach(item => {

    const subtotal =
      item.price * item.quantity;

    message +=
      "• " +
      encodeURIComponent(item.name) +
      " × " +
      item.quantity +
      " = ₹" +
      subtotal +
      "%0A";

  });


  message +=
    "%0A*TOTAL: ₹" +
    getCartTotal() +
    "*%0A%0A";

  message +=
    "Payment: UPI after WhatsApp confirmation";


  /* YOUR WHATSAPP NUMBER */

  const whatsappNumber =
    "918903188257";


  const url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    message;


  window.open(url,"_blank");

}


/* =========================
   SEARCH
========================= */

function searchProducts(){

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase();

  const filtered =
    products.filter(product =>
      product.name.toLowerCase()
        .includes(search)
    );

  displayProducts(filtered);

}


/* =========================
   CATEGORY FILTER
========================= */

function filterProducts(category){

  if(category === "All"){

    displayProducts(products);

    return;

  }

  const filtered =
    products.filter(product =>
      product.category === category
    );

  displayProducts(filtered);

}


/* =========================
   START WEBSITE
========================= */

displayProducts(products);
